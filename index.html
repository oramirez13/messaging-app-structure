<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluación – Semana 02</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="phone">
      <table class="topbar-table">
        <tr>
          <th class="topbar-title">Whatsapp</th>
        </tr>
      </table>

      <table class="tabs-table">
        <tr>
          <td class="user-photo-td">
            <img src="img/orami.png" class="user-tab-img" />
          </td>
          <th class="active">Chats</th>
          <th>Estado</th>
          <th>Llamadas</th>
        </tr>
      </table>

      <table class="chat-list-table">
        <tr>
          <td class="photo-td">
            <img src="img/pexels-anna-nekrashevich.jpg" class="photo-img" />
          </td>
          <td class="info-td">
            <strong>Anna Nekrashevich</strong><br />
            <span class="message-preview">Vamos a reunirnos en…</span>
          </td>
          <td class="right-td">
            <div class="time">15:44</div>
            <div class="badge">5</div>
          </td>
        </tr>

        <tr>
          <td class="photo-td">
            <img src="img/pexels-dexter-johns.jpg" class="photo-img" />
          </td>
          <td class="info-td">
            <strong>Dexter Johns</strong><br />
            <span class="message-preview">Nos vemos en…</span>
          </td>
          <td class="right-td">
            <div class="time">15:41</div>
          </td>
        </tr>

        <tr>
          <td class="photo-td">
            <img src="img/pexels-ekaterina-bolovtsova.jpg" class="photo-img" />
          </td>
          <td class="info-td">
            <strong>Ekaterina Bolovtsova</strong><br />
            <span class="message-preview">Ya estamos listos…</span>
          </td>
          <td class="right-td">
            <div class="time">14:39</div>
          </td>
        </tr>

        <tr>
          <td class="photo-td">
            <img src="img/pexels-gabby-lach.jpg" class="photo-img" />
          </td>
          <td class="info-td">
            <strong>Gabby Lach</strong><br />
            <span class="message-preview">En la tarde no…</span>
          </td>
          <td class="right-td">
            <div class="time">14:07</div>
            <div class="badge">1</div>
          </td>
        </tr>

        <tr>
          <td class="photo-td">
            <img src="img/pexels-patrick-jones.jpg" class="photo-img" />
          </td>
          <td class="info-td">
            <strong>Patrick Jones</strong><br />
            <span class="message-preview">01:56</span>
          </td>
          <td class="right-td">
            <div class="time">13:52</div>
          </td>
        </tr>
      </table>

      <div class="fab">+</div>
    </div>
  </body>
</html>
